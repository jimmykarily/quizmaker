apiVersion: v1
kind: Service
metadata:
  name: quizmaker-service
spec:
  type: NodePort
  selector:
    app: quizmaker
  ports:
    - port: 80           # Port for inside-cluster access
      targetPort: 8080   # Port the container listens on
      nodePort: 31000    # Exposed NodePort — accessible via <NodeIP>:31000
