apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cookie-secret.yaml
  - cluster-issuers.yaml
  - cert-manager.yaml

configMapGenerator:
  - name: quizmaker-questions
    files:
      - questions.yaml

generatorOptions:
  disableNameSuffixHash: true
