[[define "title"]]Verification[[end]]

[[define "body"]]
  <div class="mt-12 flex flex-col items-center justify-center space-y-8">
    <h2 class="text-2xl font-semibold text-gray-800">Scan QR to Autofill Email</h2>

    <!-- QR Scanner Box -->
    <div id="reader" class="w-80 max-w-full rounded-xl shadow-md border border-gray-300 bg-white p-4"></div>

    <!-- Form -->
    <form action="[[ .SubmitURL ]]" method="POST" class="w-full max-w-sm bg-white p-6 rounded-xl shadow-md space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input
          type="text"
          id="email"
          name="email"
          class="mt-1 block w-full rounded-md border border-gray-300 bg-gray-100 px-3 py-2 text-gray-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
        >
      </div>
      <div class="flex justify-end">
        <button
          type="submit"
          class="inline-flex items-center rounded-md bg-orange-600 px-4 py-2 text-white font-medium hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-orange-500"
        >
          Verify
        </button>
      </div>
    </form>
  </div>
[[end]]

[[define "page-javascript"]]
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <script>
    function onScanSuccess(decodedText, decodedResult) {
      console.log(`QR Code scanned: ${decodedText}`);
      document.getElementById("email").value = decodedText;
      // Optionally stop scanning after one successful scan:
      html5QrcodeScanner.clear();
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", {
        fps: 20,
        qrbox: 250,
      }
    );

    html5QrcodeScanner.render(onScanSuccess);
  </script>
[[end]]
